<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервіс Amigo</title>
    <style>
        /* Існуючі стилі */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

       /* Фонове зображення */
.background-image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('photos/photo4.jpg.jpg');
    background-size: cover;
    background-position: center;
    z-index: -1;
}

/* Затемнення фону */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6); /* Затемнення */
    z-index: 0;
}

/* Навігація */
nav {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    background: #000;
    padding: 2px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    animation: fadeIn 1.5s forwards;
}

.nav-container {
    width: 90%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    height: 80px;
}

nav ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 25px;
}

nav ul li {
    display: inline;
}

nav ul li a {
    color: #fff;
    font-size: 1.2rem;
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s ease;
}

nav ul li a:hover {
    color: #ff6347;
}
                }

        /* НОВІ СТИЛІ КНОПКИ */
        .cta-button {
            display: inline-block;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ff6347 0%, #e5533a 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            text-decoration: none;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(255, 99, 71, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent
            );
            transition: left 0.6s ease;
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 99, 71, 0.4);
        }

        .cta-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Кнопка "Повернутися на головну" */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: #ff6347;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 50px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 101;
            text-decoration: none;
            animation: fadeIn 2s forwards;
            animation-delay: 2.5s;
        }

        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background: #e5533a;
        }

        /* НОВІ СТИЛІ ДЛЯ КОНТАКТІВ */
        .contact-content {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-form {
            flex: 1;
            padding: 40px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .contact-info {
            flex: 1;
            padding: 40px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .info-item {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.1rem;
        }

        .info-item i {
            font-size: 1.8rem;
            color: #ff6347;
        }

        @media (max-width: 768px) {
            .contact-content {
                flex-direction: column;
                padding: 20px;
            }
            
            .contact-form,
            .contact-info {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

<div class="background-image"></div>
<div class="overlay"></div>

<nav>
    <div class="nav-container">
        <img src="logo.png" alt="Логотип" class="logo">
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="reviews.html">Відгуки</a></li>
            <li><a href="volunteer.html">Волонтерська допомога</a></li>
            <li><a href="contact.html">Контакти</a></li>
        </ul>
    </div>
</nav>

<section class="volunteer-section">
    <h1>Зв'яжіться з нами</h1>
    <div class="contact-content">
        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <input type="text" placeholder="Ваше ім'я" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Ваш email" required>
                </div>
                <div class="form-group">
                    <textarea rows="6" placeholder="Ваше повідомлення..." required></textarea>
                </div>
                <button type="submit" class="cta-button">Відправити</button>
            </form>
        </div>

        <div class="contact-info">
            <div class="info-item">
                <i>📍</i>
                <div>
                    <h3>Адреса</h3>
                    <p>м. Київ, вул. Героїв Дніпра 12</p>
                </div>
            </div>
            <div class="info-item">
                <i>📞</i>
                <div>
                    <h3>Телефон</h3>
                    <p><a href="tel:+380441234567">+38 (044) 123-45-67</a></p>
                </div>
            </div>
            <div class="info-item">
                <i>✉️</i>
                <div>
                    <h3>Email</h3>
                    <p><a href="mailto:info@amigo.ua">info@amigo.ua</a></p>
                </div>
            </div>
            <div class="info-item">
                <i>⏰</i>
                <div>
                    <h3>Графік роботи</h3>
                    <p>Пн-Нд: 08:00 - 20:00</p>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    // Обробник форми
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Дякуємо! Ваше повідомлення успішно відправлено.');
        this.reset();
    });

    // Анімація кнопки "Нагору"
    window.addEventListener('scroll', function() {
        const backButton = document.querySelector('.back-to-top');
        backButton.style.opacity = window.scrollY > 300 ? '1' : '0';
    });
</script>

</body>
</html>
