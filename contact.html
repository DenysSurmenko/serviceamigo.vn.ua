<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервіс Amigo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Загальні стилі */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Фон та затемнення */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('photos/photo4.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

         /* Навігація */
        nav {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            background: #000;
            padding: 2px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
        }

        .nav-container {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            height: 80px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 25px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            color: #fff;
            font-size: 1.2rem;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ff6347;
        }

        /* Основний контент */
        .volunteer-section {
            padding: 120px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5rem;
        }

        /* Форма та контакти */
        .contact-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .contact-form, .contact-info {
            flex: 1;
            min-width: 300px;
            padding: 30px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #ff6347;
        }

        /* Інформаційні блоки */
        .info-item {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-item i {
            font-size: 1.8rem;
            min-width: 40px;
            text-align: center;
        }

        /* Кнопки */
        .cta-button {
            display: inline-block;
            padding: 18px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ff6347 0%, #e5533a 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(255, 99, 71, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 99, 71, 0.4);
        }

        /* Адаптація */
        @media (max-width: 768px) {
            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .logo {
                height: 60px;
            }
            
            .volunteer-section {
                padding-top: 140px;
            }
        }
    </style>
</head>
<body>

<div class="background-image"></div>
<div class="overlay"></div>

<nav>
    <div class="nav-container">
        <img src="logo.png" alt="Логотип" class="logo">
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="reviews.html">Відгуки</a></li>
            <li><a href="volunteer.html">Волонтерська допомога</a></li>
            <li><a href="contact.html">Контакти</a></li>
        </ul>
    </div>
</nav>

<section class="volunteer-section">
    <h1>Зв'яжіться з нами</h1>
    <div class="contact-content">
        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <input type="text" placeholder="Ваше ім'я" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Ваш email" required>
                </div>
                <div class="form-group">
                    <textarea rows="6" placeholder="Ваше повідомлення..." required></textarea>
                </div>
                <button type="submit" class="cta-button">Відправити</button>
            </form>
        </div>

        <div class="contact-info">
            <div class="info-item">
                <i>📍</i>
                <div>
                    <h3>Адреса</h3>
                    <p>м. Київ, вул. Героїв Дніпра 12</p>
                </div>
            </div>
            <div class="info-item">
                <i>📞</i>
                <div>
                    <h3>Телефон</h3>
                    <p><a href="tel:+380441234567">+38 (044) 123-45-67</a></p>
                </div>
            </div>
            <div class="info-item">
                <i>✉️</i>
                <div>
                    <h3>Email</h3>
                    <p><a href="mailto:info@amigo.ua">info@amigo.ua</a></p>
                </div>
            </div>
            <div class="info-item">
                <i>⏰</i>
                <div>
                    <h3>Графік роботи</h3>
                    <p>Пн-Нд: 08:00 - 20:00</p>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const button = this.querySelector('button');
        button.classList.add('loading');
        
        setTimeout(() => {
            alert('Дякуємо! Ваше повідомлення успішно відправлено.');
            this.reset();
            button.classList.remove('loading');
        }, 1500);
    });

    window.addEventListener('scroll', function() {
        const backButton = document.querySelector('.back-to-top');
        if (backButton) {
            backButton.style.opacity = window.scrollY > 300 ? '1' : '0';
        }
    });
</script>

</body>
</html>
