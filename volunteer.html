<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Волонтерська допомога - Сервіс Amigo</title>
  <style>
      /* Оновлені базові стилі */
      :root {
          --primary-color: #1a1a1a;
          --accent-color: #ff6347;
          --text-light: #ffffff;
          --nav-height: 80px;
      }

      body {
          font-family: 'Poppins', sans-serif;
          margin: 0;
          padding: 0;
          background-color: var(--primary-color);
          color: var(--text-light);
          opacity: 0;
          animation: fadeIn 1s forwards;
      }

      @keyframes fadeIn {
          0% { opacity: 0; }
          100% { opacity: 1; }
      }

      /* Стилі фону */
      .background-image {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-image: url('photos/photo4.jpg.jpg');
          background-size: cover;
          background-position: center;
          z-index: -1;
      }

      .overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.6);
          z-index: 0;
      }

      /* Навігація - оновлені стилі */
      nav {
          position: fixed;
          top: 0;
          right: 0;
          left: 0;
          background: #000;
          padding: 2px 0;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 100;
          opacity: 0;
          animation: fadeIn 1.5s forwards;
          height: var(--nav-height);
      }

      .nav-container {
          width: 90%;
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: relative;
      }

      .logo {
          height: 80px;
          transition: transform 0.3s ease;
      }

      /* Десктопне меню */
      .desktop-menu {
          list-style-type: none;
          padding: 0;
          margin: 0;
          display: flex;
          gap: 25px;
          transition: transform 0.3s ease;
      }

      .desktop-menu li a {
          color: var(--text-light);
          font-size: 1.2rem;
          text-decoration: none;
          text-transform: uppercase;
          transition: color 0.3s ease;
          padding: 10px 15px;
      }

      .desktop-menu li a:hover {
          color: var(--accent-color);
      }

      /* Мобільне меню */
      .mobile-menu {
          position: fixed;
          top: var(--nav-height);
          right: -100%;
          width: 70%;
          height: calc(100vh - var(--nav-height));
          background: rgba(0,0,0,0.95);
          list-style: none;
          padding: 30px 20px;
          margin: 0;
          transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          z-index: 999;
      }

      .mobile-menu.active {
          right: 0;
      }

      .mobile-menu li {
          margin: 20px 0;
          opacity: 0;
          transform: translateX(20px);
          transition: opacity 0.3s, transform 0.3s;
      }

      .mobile-menu.active li {
          opacity: 1;
          transform: translateX(0);
      }

      .mobile-menu li a {
          color: var(--text-light);
          text-decoration: none;
          font-size: 1.4rem;
          display: block;
          padding: 15px;
          border-radius: 8px;
          transition: background 0.3s;
      }

      .mobile-menu li a:hover {
          background: rgba(255,255,255,0.1);
      }

      /* Бургер-іконка */
      .menu-toggle {
          display: none;
          flex-direction: column;
          gap: 5px;
          cursor: pointer;
          padding: 15px;
          background: transparent;
          border: none;
          z-index: 1000;
      }

      .menu-toggle span {
          width: 30px;
          height: 3px;
          background: var(--text-light);
          transition: 0.3s;
          transform-origin: center;
      }

      .menu-toggle.active span:nth-child(1) {
          transform: rotate(45deg) translate(5px, 5px);
      }

      .menu-toggle.active span:nth-child(2) {
          opacity: 0;
      }

      .menu-toggle.active span:nth-child(3) {
          transform: rotate(-45deg) translate(7px, -8px);
      }

      /* Стилі для секції волонтерів */
      .volunteer-section {
          padding: 150px 20px;
          position: relative;
          z-index: 1;
          opacity: 0;
          animation: fadeIn 2s forwards;
          animation-delay: 0.5s;
      }

      /* Карусель та інші елементи залишаються незмінними */

      @media (max-width: 768px) {
          .desktop-menu {
              display: none;
          }

          .menu-toggle {
              display: flex;
          }

          .mobile-menu {
              width: 100%;
              right: -100%;
              padding: 20px;
          }

          .mobile-menu.active {
              right: 0;
          }

          .mobile-menu li a {
              font-size: 1.2rem;
              padding: 12px;
          }

          .logo {
              height: 60px;
          }

          .volunteer-section {
              padding: 120px 15px;
          }
      }

      /* Решта стилів залишаються незмінними */
  </style>
</head>
<body>
  <div class="background-image"></div>
  <div class="overlay"></div>

  <nav>
      <div class="nav-container">
          <img src="logo.png.png" alt="Логотип" class="logo">
          <button class="menu-toggle" aria-label="Відкрити меню">
              <span></span>
              <span></span>
              <span></span>
          </button>
          <ul class="desktop-menu">
              <li><a href="index.html">Головна</a></li>
              <li><a href="reviews.html">Відгуки</a></li>
              <li><a href="volunteer.html">Волонтерська допомога</a></li>
              <li><a href="contact.html">Контакти</a></li>
          </ul>
      </div>
  </nav>

  <!-- Мобільне меню -->
  <ul class="mobile-menu">
      <li><a href="index.html">Головна</a></li>
      <li><a href="reviews.html">Відгуки</a></li>
      <li><a href="volunteer.html">Волонтерська допомога</a></li>
      <li><a href="contact.html">Контакти</a></li>
  </ul>

  <section class="volunteer-section">
      <!-- Вміст секції залишається незмінним -->
  </section>

  <a href="#" class="back-to-top">☝</a>

  <script>
      // Оновлений JavaScript для меню
      const menuToggle = document.querySelector('.menu-toggle');
      const mobileMenu = document.querySelector('.mobile-menu');
      const body = document.body;
      let isMenuOpen = false;

      // Обробник кліків
      menuToggle.addEventListener('click', toggleMenu);
      
      // Обробник сенсорних подій
      menuToggle.addEventListener('touchstart', function(e) {
          e.preventDefault();
          toggleMenu();
      });

      // Закриття меню при кліку поза ним
      document.addEventListener('click', function(e) {
          if(isMenuOpen && !e.target.closest('.mobile-menu') && !e.target.closest('.menu-toggle')) {
              toggleMenu();
          }
      });

      // Закриття меню при скролі
      window.addEventListener('scroll', function() {
          if(isMenuOpen) {
              toggleMenu();
          }
      });

      function toggleMenu() {
          isMenuOpen = !isMenuOpen;
          menuToggle.classList.toggle('active');
          mobileMenu.classList.toggle('active');
          body.style.overflow = isMenuOpen ? 'hidden' : 'auto';
          
          // Анімація пунктів меню
          if(isMenuOpen) {
              const menuItems = document.querySelectorAll('.mobile-menu li');
              menuItems.forEach((item, index) => {
                  item.style.transitionDelay = `${index * 0.1}s`;
              });
          }
      }
  </script>
</body>
</html>
